services:
  - type: web
    name: social-media-analyzer-backend
    runtime: docker
    plan: free

    dockerfilePath: backend/Dockerfile
    dockerContext: backend

    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10

      - key: DJANGO_SETTINGS_MODULE
        value: config.settings

      - key: DEBUG
        value: "False"

      - key: GEMINI_API_KEY
        sync: false

      - key: SECRET_KEY
        sync: false
